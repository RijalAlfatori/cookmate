name: cookmate
description: "CookMate - Recipe Catalog & Meal Planner App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP client for REST API calls
  http: ^1.2.2
  # Local storage for saving favorite recipes & personal notes
  shared_preferences: ^2.3.2
  # Modern typography with Google Fonts (Poppins)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
